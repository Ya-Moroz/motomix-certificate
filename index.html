<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Сертификатов | MotoMix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Rubik', sans-serif;
            background-color: #1a1a1c;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .admin-panel {
            background-color: #262629;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #3a3a3d;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        input {
            padding: 10px;
            background-color: #1a1a1c;
            border: 1px solid #4a4a4d;
            color: #fff;
            font-size: 16px;
            border-radius: 4px;
            width: 150px;
            font-family: 'Rubik', sans-serif;
            font-weight: 500;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            background-color: #ff4500;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Rubik', sans-serif;
        }

        button:hover {
            background-color: #e03d00;
        }

        .btn-secondary { background-color: #444; }
        .btn-secondary:hover { background-color: #555; }

        .preview-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Обертка теперь просто держит пропорции */
        .certificate-wrapper {
            width: 100%;
            aspect-ratio: 3508 / 2480;
            position: relative;
            background-color: #111;
            overflow: hidden;
        }

        /* Фон вставлен физической картинкой */
        .cert-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* Фон на заднем плане */
        }

        /* Текстовые блоки подняты наверх (z-index: 2) */
        .cert-amount {
            position: absolute;
            top: 45%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 8vw; 
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            z-index: 2; 
        }

        .cert-number {
            position: absolute;
            bottom: 5%; 
            left: 5%; 
            font-size: 1.2vw;
            color: #77777c; 
            font-weight: 400;
            letter-spacing: 1px;
            z-index: 2;
        }

        .cert-date {
            position: absolute;
            bottom: 5%; 
            right: 5%; 
            font-size: 1.2vw;
            color: #a0a0a5;
            font-weight: 400;
            letter-spacing: 1px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="input-group">
            <label for="amountInput">Сумма (₽)</label>
            <input type="text" id="amountInput" value="3 000">
        </div>
        
        <div class="btn-group">
            <button class="btn-secondary" onclick="generateNewData()">Обновить номер</button>
            <button onclick="downloadJPEG()">Скачать JPEG</button>
        </div>
    </div>

    <div class="preview-container">
        <div class="certificate-wrapper" id="certBlock">
            <img src="certificate-bg.jpg" class="cert-bg" id="bgImage" alt="Фон" crossorigin="anonymous">
            
            <div class="cert-amount" id="certAmount">3 000 ₽</div>
            <div class="cert-number" id="certNumber">№ MM-2026-0000</div>
            <div class="cert-date" id="certDate">Действителен до: --.--.----</div>
        </div>
    </div>

    <script>
        function formatDate(date) {
            let dd = String(date.getDate()).padStart(2, '0');
            let mm = String(date.getMonth() + 1).padStart(2, '0');
            let yyyy = date.getFullYear();
            return `${dd}.${mm}.${yyyy}`;
        }

        function generateId() {
            const chars = '0123456789';
            let randomPart = '';
            for (let i = 0; i < 4; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const currentYear = new Date().getFullYear();
            return `№ MM-${currentYear}-${randomPart}`;
        }

        function updateCertificate() {
            let amountVal = document.getElementById('amountInput').value;
            if (!amountVal.includes('₽')) {
                document.getElementById('certAmount').innerText = amountVal + ' ₽';
            } else {
                document.getElementById('certAmount').innerText = amountVal;
            }

            let expDate = new Date();
            expDate.setMonth(expDate.getMonth() + 2);
            document.getElementById('certDate').innerText = `Действителен до: ${formatDate(expDate)}`;
        }

        function generateNewData() {
            document.getElementById('certNumber').innerText = generateId();
            updateCertificate();
        }

        function downloadJPEG() {
            const certNode = document.getElementById('certBlock');
            const targetWidth = 3508;
            const targetHeight = 2480;

            const btn = document.querySelector('button[onclick="downloadJPEG()"]');
            const originalText = btn.innerText;
            btn.innerText = 'Генерация...';
            btn.disabled = true;

            // Секретный трюк для максимального качества: 
            // временно увеличиваем блок до реальных 3508px перед снимком
            const originalWidth = certNode.style.width;
            const originalHeight = certNode.style.height;
            const originalPosition = certNode.style.position;
            
            certNode.style.width = targetWidth + 'px';
            certNode.style.height = targetHeight + 'px';
            certNode.style.position = 'absolute';
            
            // Временно меняем шрифты на пиксельные значения, чтобы они не слетели при увеличении блока
            document.getElementById('certAmount').style.fontSize = '280px';
            document.getElementById('certNumber').style.fontSize = '42px';
            document.getElementById('certDate').style.fontSize = '42px';

            html2canvas(certNode, {
                scale: 1, // Масштабировать не нужно, блок уже огромный
                useCORS: true,
                backgroundColor: '#111111',
                width: targetWidth,
                height: targetHeight
            }).then(canvas => {
                // Возвращаем стили блока обратно
                certNode.style.width = originalWidth;
                certNode.style.height = originalHeight;
                certNode.style.position = originalPosition;
                document.getElementById('certAmount').style.fontSize = '';
                document.getElementById('certNumber').style.fontSize = '';
                document.getElementById('certDate').style.fontSize = '';

                const link = document.createElement('a');
                const certNumClean = document.getElementById('certNumber').innerText.replace('№ ', '');
                link.download = `MotoMix-${certNumClean}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0); // Качество 100%
                link.click();

                btn.innerText = originalText;
                btn.disabled = false;
            }).catch(err => {
                alert('Произошла ошибка: ' + err);
                
                // На случай сбоя тоже возвращаем стили
                certNode.style.width = originalWidth;
                certNode.style.height = originalHeight;
                certNode.style.position = originalPosition;
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }

        document.getElementById('amountInput').addEventListener('input', updateCertificate);

        window.onload = function() {
            generateNewData();
        };
    </script>
</body>
</html>
