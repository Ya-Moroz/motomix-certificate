<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Сертификатов | MotoMix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Rubik', sans-serif;
            background-color: #1a1a1c;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .admin-panel {
            background-color: #262629;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            margin-bottom: 30px;
            border-radius: 8px;
            display: flex;
            gap: 20px;
            align-items: flex-end; /* Выравниваем элементы по нижнему краю */
            justify-content: space-between;
            border: 1px solid #3a3a3d;
            flex-wrap: wrap;
        }
        
        .inputs-wrapper {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        label {
            font-size: 12px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        input {
            padding: 10px;
            background-color: #1a1a1c;
            border: 1px solid #4a4a4d;
            color: #fff;
            font-size: 16px;
            border-radius: 4px;
            width: 150px;
            font-family: 'Rubik', sans-serif;
            font-weight: 500;
        }
        
        /* Стилизация иконки календаря для светлых браузеров */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 25px;
            background-color: #ff4500;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Rubik', sans-serif;
            height: 41px; /* Чтобы кнопки были одной высоты с полями ввода */
        }

        button:hover { background-color: #e03d00; }
        .btn-secondary { background-color: #444; }
        .btn-secondary:hover { background-color: #555; }

        .preview-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .certificate-wrapper {
            width: 100%;
            aspect-ratio: 3508 / 2480;
            position: relative;
            background-color: #111;
            overflow: hidden;
        }

        .cert-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        .cert-amount {
            position: absolute;
            top: 63%; left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 6.5vw; 
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            z-index: 2; 
        }

        .cert-number {
            position: absolute;
            bottom: 5%; left: 5%; 
            font-size: 1.2vw;
            color: #77777c; 
            font-weight: 400;
            letter-spacing: 1px;
            z-index: 2;
        }

        .cert-date {
            position: absolute;
            bottom: 5%; right: 5%; 
            font-size: 1.2vw;
            color: #a0a0a5;
            font-weight: 400;
            letter-spacing: 1px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="inputs-wrapper">
            <div class="input-group">
                <label for="amountInput">Сумма (₽)</label>
                <input type="text" id="amountInput" value="3 000 ₽">
            </div>
            
            <div class="input-group">
                <label for="dateInput">Действует до</label>
                <input type="date" id="dateInput">
            </div>
        </div>
        
        <div class="btn-group">
            <button class="btn-secondary" onclick="generateNewData()">Обновить №</button>
            <button onclick="downloadPerfectJPEG()">Скачать JPEG</button>
        </div>
    </div>

    <div class="preview-container">
        <div class="certificate-wrapper">
            <img src="certificate-bg.jpg" class="cert-bg" id="bgImage" alt="Фон" crossorigin="anonymous">
            
            <div class="cert-amount" id="certAmount">3 000 ₽</div>
            <div class="cert-number" id="certNumber">№ MM-2026-0000</div>
            <div class="cert-date" id="certDate">Действителен до: --.--.----</div>
        </div>
    </div>

    <script>
        function generateId() {
            const chars = '0123456789';
            let randomPart = '';
            for (let i = 0; i < 4; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            const currentYear = new Date().getFullYear();
            return `№ MM-${currentYear}-${randomPart}`;
        }
        
        // Устанавливаем дату "Сегодня + 2 месяца" по умолчанию в поле календаря
        function setDefaultDate() {
            let expDate = new Date();
            expDate.setMonth(expDate.getMonth() + 2);
            
            // Формат для input type="date" должен быть строго YYYY-MM-DD
            let yyyy = expDate.getFullYear();
            let mm = String(expDate.getMonth() + 1).padStart(2, '0');
            let dd = String(expDate.getDate()).padStart(2, '0');
            
            document.getElementById('dateInput').value = `${yyyy}-${mm}-${dd}`;
        }

        function updateCertificate() {
            // 1. Обновляем сумму
            let amountVal = document.getElementById('amountInput').value;
            if (!amountVal.includes('₽')) {
                document.getElementById('certAmount').innerText = amountVal;
            } else {
                document.getElementById('certAmount').innerText = amountVal;
            }

            // 2. Обновляем дату, беря её из поля ввода
            let dateVal = document.getElementById('dateInput').value;
            if (dateVal) {
                // Превращаем YYYY-MM-DD обратно в красивый русский DD.MM.YYYY
                let parts = dateVal.split('-');
                document.getElementById('certDate').innerText = `Действителен до: ${parts[2]}.${parts[1]}.${parts[0]}`;
            }
        }

        function generateNewData() {
            document.getElementById('certNumber').innerText = generateId();
            updateCertificate();
        }

        function downloadPerfectJPEG() {
            const btn = document.querySelector('button[onclick="downloadPerfectJPEG()"]');
            const originalText = btn.innerText;
            btn.innerText = 'Генерация...';
            btn.disabled = true;

            try {
                const canvas = document.createElement('canvas');
                canvas.width = 3508;
                canvas.height = 2480;
                const ctx = canvas.getContext('2d');

                const img = document.getElementById('bgImage');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                const amountText = document.getElementById('certAmount').innerText;
                const numberText = document.getElementById('certNumber').innerText;
                const dateText = document.getElementById('certDate').innerText;

                ctx.font = '700 380px Rubik';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(amountText, canvas.width / 2, canvas.height * 0.645);

                ctx.font = '400 42px Rubik';
                ctx.fillStyle = '#77777c';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'bottom';
                ctx.fillText(numberText, canvas.width * 0.05, canvas.height * 0.95);

                ctx.font = '400 42px Rubik';
                ctx.fillStyle = '#77777c';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText(dateText, canvas.width * 0.95, canvas.height * 0.95);

                const link = document.createElement('a');
                const certNumClean = numberText.replace('№ ', '');
                link.download = `MotoMix-${certNumClean}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 1.0);
                link.click();

            } catch (err) {
                alert('Ошибка при генерации. Убедитесь, что фон загрузился полностью.');
                console.error(err);
            }

            btn.innerText = originalText;
            btn.disabled = false;
        }

        // Слушаем изменения в обоих полях ввода
        document.getElementById('amountInput').addEventListener('input', updateCertificate);
        document.getElementById('dateInput').addEventListener('input', updateCertificate);

        window.onload = function() {
            setDefaultDate(); // Сначала ставим дату в календарь
            generateNewData(); // Затем генерируем номер и отрисовываем всё на экране
        };
    </script>
</body>
</html>
